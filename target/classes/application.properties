spring.application.name=enterprise-helpdesk
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/enterprise_helpdesk?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:helpdesk_user}
spring.datasource.password=${DB_PASSWORD:helpdesk_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
